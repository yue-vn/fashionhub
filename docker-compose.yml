name: fashionhub

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fashionhub-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:-UltraStore@2026!}"
      MSSQL_PID: "Express"
    ports:
      - "${SQL_PORT:-1433}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SQL_SA_PASSWORD:-UltraStore@2026!}' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P '${SQL_SA_PASSWORD:-UltraStore@2026!}' -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - fashionhub-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fashionhub-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: "http://+:8080"
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "false"
      ForceHttps: "false"
      EnableSwagger: "true"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${SQL_DATABASE:-BiCaCuaTho};User Id=sa;Password=${SQL_SA_PASSWORD:-UltraStore@2026!};TrustServerCertificate=True;MultipleActiveResultSets=true;"
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/wwwroot/uploads
    networks:
      - fashionhub-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:8080}"
    container_name: fashionhub-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - fashionhub-net
    restart: unless-stopped

volumes:
  sqlserver_data:
  backend_uploads:

networks:
  fashionhub-net:
    driver: bridge
